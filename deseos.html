<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pg-title">Dejá tu deseo</title>

<!-- ══════════════════════════════════════════════════════════════════════
     LIBRO DE DESEOS
     Lo que ve el invitado cuando apoya el celular en el tag NFC de la mesa
     (o escanea el QR del cartelito de la mesa).

     ⚠️ El invitado ESCRIBE y nada más: no puede leer un solo deseo, ni el
     suyo. `deseo_enviar` devuelve un número, nunca filas — si devolviera
     la lista, cualquiera con el slug leería los mensajes de todos.
     Se activa por evento con `config.deseos_activo`.

     ⚠️ ES UN BUZÓN PRIVADO, decidido el 27/08/2026. Los deseos NO se
     muestran a los demás invitados: van derecho al panel de la clienta.
     Eso saca el muro público —y con él, el empuje de ver que otros ya
     escribieron—, así que se compensa con el CONTADOR: "sos el deseo
     número 34 de la noche". Da la sensación de fiesta entera participando
     sin revelar un solo nombre. Y de paso el privado juega a favor: quien
     escribe sabe que solo lo lee ella, y se anima a escribir en serio.

     ⚠️ La pantalla hereda el tema del evento: colores, dupla tipográfica y
     foto. Si el invitado toca el tag y aterriza en algo que parece otra
     web, duda y se va.

     ⚠️ Ningún color escrito a mano, por la misma razón que en
     invitacion.html: lo que sobre blanco es "gris clarito", sobre #0d0d1a
     es "casi blanco". Ver la sección de colores en CLAUDE.md.

     ⚠️ Lo "juvenil" está en el MOVIMIENTO, no en la tipografía: la fuente
     la elige la clienta y la misma pantalla tiene que servir para unos 15
     y para un casamiento. Lo único fijo es la manuscrita de la firma, que
     funciona bien en los dos.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --primary:#1a1a1a; --secondary:#d6ecc0; --bg:#ffffff;
  --on-accent:#1a1a1a;
  --font-titulo:'Cormorant Garamond',Georgia,serif;
  --font:'Jost',system-ui,sans-serif;
  --font-mano:'Caveat',cursive;

  --ink-soft: color-mix(in srgb, var(--primary) 62%, var(--bg));
  --velo-1:   color-mix(in srgb, var(--primary) 3%,  var(--bg));
  --velo-2:   color-mix(in srgb, var(--primary) 6%,  var(--bg));
  --borde:    color-mix(in srgb, var(--primary) 14%, transparent);

  /* La curva de todo. Un ease-out fuerte: arranca rápido, frena suave.
     Es lo que hace que una pantalla se sienta despierta y no pesada. */
  --curva: cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--primary);
  font-family:var(--font); font-size:17px; line-height:1.6;
  min-height:100dvh; padding:0 22px calc(40px + env(safe-area-inset-bottom));
  opacity:0; transition:opacity 420ms var(--curva);
  overflow-x:hidden;
}
body.listo{opacity:1}

/* Columna: la hoja crece y el footer queda pegado abajo aunque la
   pantalla sea corta (el libro cerrado, un deseo ya enviado). */
body{display:flex;flex-direction:column}
.hoja{max-width:520px;width:100%;margin:0 auto;flex:1 0 auto}

/* Entrada escalonada. Cada bloque entra 60ms después del anterior: se lee
   como una sola cosa que se acomoda, no como cinco que aparecen sueltas. */
.entra{opacity:0;transform:translateY(14px);
       animation:entrar 620ms var(--curva) forwards}
@keyframes entrar{to{opacity:1;transform:none}}

/* ── La portada ───────────────────────────────────────────────────────
   Lo primero que ve alguien que acaba de escanear el QR de una mesa. La
   foto ocupa el ancho entero y se disuelve hacia abajo en el papel del
   evento: reconocer la cara de la agasajada es lo que confirma, en medio
   segundo, que está en el lugar correcto. Antes era un redondelito de
   86px y no cumplía esa función.

   ⚠️⚠️ EL TEXTO NO SE APOYA NUNCA SOBRE LA FOTO. Abajo del título sube
   una pared de papel que llega a opaca 4px ANTES de donde arranca la
   primera letra. Es la única garantía posible: la foto la elige el
   cliente —puede ser un cielo blanco o una noche negra— y la misma
   pantalla tiene que servir con papel blanco y con papel casi negro. No
   existe una opacidad que funcione en los cuatro casos.
   ⚠️ La pared va en px, NO en %: en porcentaje se corre según cuántos
   renglones ocupe la pregunta, y "¿Qué les deseás a Carolina & Martín?"
   ocupa uno más que "¿Qué le deseás a Alma?".                          */
.portada{
  position:relative; margin:0 -22px;
  min-height:clamp(250px, 42dvh, 360px);
  display:flex; flex-direction:column; justify-content:flex-end;
  align-items:center; text-align:center;
  padding:0 22px;
}
.portada .foto{position:absolute; inset:0; overflow:hidden; background:var(--velo-2)}
/* La foto se acomoda al entrar: un acercamiento de UNA SOLA VEZ. El único
   que se repite en bucle sigue siendo el halo; dos distraen.
   ⚠️ El transform va en el hijo: escalar el contenedor le movería también
   la pared de papel al texto. */
.portada .foto > i{
  position:absolute; inset:0; display:block;
  background-size:cover; background-position:center 25%;
  animation:acomodar 2600ms var(--curva) both;
}
@keyframes acomodar{from{transform:scale(1.07)}to{transform:scale(1)}}

.marca{position:relative; z-index:1; width:100%; padding:60px 0 0}
.marca::before{
  content:''; position:absolute; left:-22px; right:-22px; top:0; bottom:-1px;
  background:linear-gradient(to bottom, transparent 0, var(--bg) 56px);
  z-index:-1;
}
.tipo{
  font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink-soft);
}
/* Sin foto la portada no tiene nada que mostrar: se achica y el nombre
   del evento pasa a ser el encabezado. */
.portada.sin-foto{min-height:0;padding-top:30px}
.portada.sin-foto .marca{padding-top:0}
.portada.sin-foto .marca::before{display:none}

/* Ya escribió: la pregunta no se vuelve a hacer y la foto se corre para
   que el número y el alias queden arriba del pliegue. */
body.compacta #pregunta{display:none}
body.compacta .portada{min-height:clamp(150px, 24dvh, 210px)}

/* ⚠️ Pantallas cortas (un iPhone SE, o cualquier celular con la barra del
   navegador comiéndose 120px). Sin esto la portada se lleva puesto el
   botón de enviar, que es lo único que NO puede quedar abajo del pliegue. */
@media (max-height:760px){
  .portada{min-height:clamp(140px, 26dvh, 230px)}
  .marca{padding-top:44px}
  .marca::before{background:linear-gradient(to bottom, transparent 0, var(--bg) 40px)}
  h1{font-size:clamp(1.5rem,6.2vw,1.9rem)}
  .ayuda{margin-top:10px;font-size:.85rem}
  .chips{margin-top:14px}
  form{margin-top:15px}
  textarea{min-height:84px}
}

/* ── La pregunta ──────────────────────────────────────────────────────
   Una PREGUNTA, no "dejá tu mensaje": a una caja vacía la gente le
   escribe "felicidades!!". Va acá arriba, adentro de la portada, en vez
   de repetir el nombre en un bloque aparte — son ~90px menos, que es lo
   que hace que todo lo que hay que hacer entre en una sola pantalla. */
h1{
  font-family:var(--font-titulo); font-weight:400;
  font-size:clamp(1.8rem,7.2vw,2.35rem); line-height:1.1;
  letter-spacing:-.015em; text-wrap:balance; margin-top:6px;
}
.ayuda{
  margin-top:13px;font-size:.9rem;line-height:1.5;color:var(--ink-soft);
  text-align:center;text-wrap:pretty;
}
/* ── Los disparadores ──────────────────────────────────────────────────
   "No sé qué poner" es la razón número uno por la que alguien abre esto y
   lo cierra sin escribir. Tres botones que arrancan la frase por vos.  */
.chips{
  display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:18px;
}
.chip{
  font-family:inherit;font-size:.8rem;color:var(--ink-soft);
  background:var(--velo-1);border:1px solid var(--borde);
  border-radius:50px;padding:11px 14px;min-height:44px;cursor:pointer;
  transition:transform 160ms var(--curva), background 200ms ease, color 200ms ease;
}
.chip:active{transform:scale(.95)}
.chip.puesto{background:var(--secondary);color:var(--on-accent);border-color:transparent}
/* En cuanto escribís algo tuyo, los disparadores ya cumplieron: se van y
   te dejan la pantalla, que con el teclado abierto es lo que falta.
   Vuelven si borrás todo. */
.chips{overflow:hidden;max-height:120px;
       transition:max-height 320ms var(--curva), opacity 240ms ease, margin-top 320ms var(--curva)}
.chips.guardados{max-height:0;opacity:0;margin-top:0;pointer-events:none}

/* ── El formulario ─────────────────────────────────────────────────── */
form{margin-top:20px}
/* El contador va en la MISMA fila que la etiqueta. Suelto abajo del campo
   ocupaba 24px fijos aunque estuviera invisible — y esos 24px son la
   diferencia entre entrar en una pantalla y no entrar. */
label{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:7px;
}
textarea,input{
  width:100%;font-family:inherit;font-size:1.05rem;color:var(--primary);
  background:var(--velo-1);border:1px solid var(--borde);border-radius:14px;
  padding:15px 16px;
  transition:border-color 200ms ease, background 200ms ease;
}
textarea{min-height:104px;resize:none;line-height:1.55;overflow:hidden}
textarea::placeholder,input::placeholder{color:var(--ink-soft);opacity:.7}
textarea:focus,input:focus{
  outline:none;border-color:var(--secondary);background:var(--velo-2);
}
/* La firma se escribe a mano, como en una tarjeta de verdad. Es el toque
   que la hace sentir personal sin romper un casamiento clásico: la letra
   manuscrita funciona igual de bien en los dos. */
#firma,#fotos-nombre{font-family:var(--font-mano);font-size:1.5rem;padding-top:11px;padding-bottom:11px}
#firma::placeholder,#fotos-nombre::placeholder{font-family:var(--font);font-size:1.05rem}
.campo + .campo{margin-top:14px}

.cuenta{
  font-size:.64rem;letter-spacing:.04em;text-transform:none;
  color:var(--ink-soft);white-space:nowrap;
  opacity:0;transition:opacity 240ms ease;
}
.cuenta.cerca{opacity:1}

.enviar{
  width:100%;margin-top:18px;min-height:54px;
  font-family:inherit;font-size:.82rem;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;
  background:var(--secondary);color:var(--on-accent);
  border:0;border-radius:50px;padding:16px 24px;cursor:pointer;
  transition:transform 160ms var(--curva), opacity 200ms ease;
}
.enviar:active{transform:scale(.975)}
.enviar[disabled]{opacity:.5;cursor:default}

.aviso{
  margin-top:12px;text-align:center;font-size:.8rem;
  color:var(--primary);min-height:1.15em;
  opacity:0;transform:translateY(-4px);
  transition:opacity 220ms ease, transform 220ms var(--curva);
}
.aviso.visible{opacity:1;transform:none}
/* ── El envío: la carta se va ──────────────────────────────────────── */
#paso-escribir.enviando{
  animation:volar 760ms var(--curva) forwards;
  pointer-events:none;
}
@keyframes volar{
  30% {transform:scale(.985) translateY(4px);opacity:1}
  100%{transform:scale(.9) translateY(-40px);opacity:0}
}

.sobre{width:96px;height:96px;margin:0 auto 26px;display:block}
.sobre .solapa{
  transform-origin:50% 30%;
  animation:cerrar 620ms var(--curva) 120ms both;
}
@keyframes cerrar{from{transform:rotateX(-172deg)}to{transform:rotateX(0)}}
.sobre .cuerpo{animation:entrar 460ms var(--curva) both}

/* ── Confirmación ──────────────────────────────────────────────────── */
.ok{text-align:center;padding:26px 0 16px}
.ok h2{font-family:var(--font-titulo);font-weight:400;font-size:2rem;line-height:1.15}
.ok p{margin-top:12px;color:var(--ink-soft);font-size:.95rem;text-wrap:pretty}
.numero{
  margin-top:30px;padding:22px 18px;border-radius:18px;
  background:var(--velo-1);border:1px solid var(--borde);
}
.numero .n{
  font-family:var(--font-titulo);font-size:3rem;line-height:1;
  color:var(--primary);font-variant-numeric:tabular-nums;
}
/* El ordinal, o "34 deseo de la noche" se lee mal. */
.numero .orden{font-size:1.5rem;vertical-align:top;line-height:1.5;opacity:.6}
.numero .t{
  margin-top:8px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft);
}
/* ── El recordatorio del regalo ───────────────────────────────────────
   Va DESPUÉS de enviar el deseo, nunca antes. Recién escribió algo
   cariñoso, está con el celular en la mano y en la fiesta: es el momento
   en que el alias sirve. Arriba, compitiendo con el campo de texto,
   sería un cartel de cobro y le sacaría lugar a lo único que hay que
   hacer en esa pantalla.
   Aparece solo si el evento tiene alias cargado y no es una fiesta de
   lluvia de sobres — ahí no hay nada que transferir. */
.regalo{
  margin-top:26px;padding:20px 18px 18px;border-radius:18px;
  background:var(--velo-1);border:1px solid var(--borde);
}
.regalo-t{font-size:.88rem;line-height:1.5;color:var(--ink-soft);text-wrap:pretty}
.alias{
  margin-top:13px;width:100%;min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--secondary);color:var(--on-accent);border:0;border-radius:16px;
  padding:12px 18px;cursor:pointer;font-family:inherit;
  transition:transform 160ms var(--curva);
}
.alias:active{transform:scale(.975)}
/* El alias es un dato que se copia: va en un ancho fijo por carácter, o
   una "l" y una "i" pegadas se leen como una sola letra al dictarlo. */
.alias .a{font-size:1.08rem;font-weight:600;word-break:break-all;
          font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.25}
.alias .c{font-size:.63rem;letter-spacing:.16em;text-transform:uppercase}

.otro{
  margin-top:22px;background:transparent;color:var(--primary);
  border:1px solid var(--borde);border-radius:50px;padding:15px 30px;min-height:48px;
  font-family:inherit;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;transition:transform 160ms var(--curva);
}
.otro:active{transform:scale(.975)}

/* ── Elegir: deseo o fotos ────────────────────────────────────────────
   Aparece sólo si el evento tiene las dos cosas activas. Dos opciones y
   nada más: a la una de la mañana cada decisión extra pierde gente. */
.opciones{display:flex;flex-direction:column;gap:12px;margin-top:22px}
/* Pintadas del acento del evento. El texto va en --on-accent, SÓLIDO: lo
   calcula el JS para que se lea sobre un verde pastel o sobre un bordó. */
.opcion{
  width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--on-accent);
  background:var(--secondary);border:0;border-radius:18px;
  padding:18px 20px;min-height:84px;display:flex;align-items:center;gap:16px;
  box-shadow:0 6px 18px -10px color-mix(in srgb, var(--primary) 45%, transparent);
  transition:transform 160ms var(--curva), filter 200ms ease;
}
.opcion:active{transform:scale(.975);filter:brightness(.94)}
.opcion svg{width:34px;height:34px;flex:none;color:var(--on-accent)}
.opcion b{display:block;font-family:var(--font-titulo);font-weight:400;font-size:1.4rem;line-height:1.15}
.opcion span{display:block;margin-top:3px;font-size:.84rem;line-height:1.4;color:var(--on-accent)}

/* ── Con ambiente (el fondo del libro de deseos) ──────────────────────
   La acuarela va fija detrás de todo; la foto de la agasajada, enmarcada
   y entera arriba; y todo lo que tiene texto sobre UNA hoja de papel.
   ⚠️ El texto nunca se apoya sobre la imagen: el fondo lo elige el
   cliente y puede ser un mediodía o una noche. La hoja trae su piso.
   ⚠️ No con background-attachment:fixed: iOS lo ignora. Va un div fijo. */
/* ⚠️ 100lvh y no inset:0 — al scrollear, el celular esconde su barra, el
   alto de la pantalla cambia y un fondo de 100% "salta". Con el alto
   GRANDE de la pantalla, la acuarela ya cubre todo y no se mueve. */
#ambiente{position:fixed;left:0;right:0;top:0;height:100lvh;z-index:-1;
  background:var(--bg) center/cover no-repeat;display:none}
body.ambiente #ambiente{display:block}
body.ambiente{background:var(--bg)}

/* Todo en UNA pantalla: la agasajada en un retrato redondo (reconocer su
   cara confirma que escaneaste el QR correcto), y la acuarela de fondo de
   protagonista. La hoja se arma en columna para que la silueta ocupe
   sólo el lugar que sobra. */
body.ambiente .hoja{display:flex;flex-direction:column}
body.ambiente .portada{min-height:0;margin:16px 0 0;padding:0;display:flex;
  flex-direction:column;align-items:center}
body.ambiente .portada .foto{
  position:relative;inset:auto;width:112px;height:112px;border-radius:50%;flex:none;
  border:4px solid var(--bg);box-shadow:0 10px 24px -12px rgba(0,0,0,.55);
}
body.ambiente .portada .foto > i{background-position:center 22%}
body.ambiente .marca{
  margin-top:12px;padding:18px 20px 2px;background:var(--bg);
  border-radius:22px 22px 0 0;
}
body.ambiente .marca::before{display:none}
body.ambiente h1{font-size:clamp(1.55rem,6.4vw,1.95rem)}
body.ambiente section{background:var(--bg);border-radius:0 0 22px 22px;padding:2px 20px 20px}
body.ambiente .opciones{margin-top:16px;gap:10px}
body.ambiente .volver{margin:0;padding:8px 0}
body.ambiente .fotos-campo{margin-top:12px}
body.ambiente #paso-fotos .ayuda{margin-top:4px}
body.ambiente .opcion{min-height:76px;padding:14px 18px}
body.ambiente .portada.sin-foto .marca{margin-top:0}
body.ambiente.compacta .portada .foto{width:84px;height:84px}
@media (max-height:620px){
  body.ambiente .portada .foto{width:84px;height:84px}
  body.ambiente .portada{margin-top:10px}
}
/* ── Nuestro footer ───────────────────────────────────────────────────
   El mismo de invitacion.html, y la misma excepción a los tokens: bloque
   oscuro fijo con texto blanco, para que se lea sobre cualquier tema.
   Cada invitado que escanea el QR de una mesa es un próximo cliente.
   Los ?utm_ son la única medición: viajan en el link y sólo cuentan a quien
   hace clic. Acá no hay ni GA4 ni píxel. */
.pie{
  margin:36px -22px calc(-40px - env(safe-area-inset-bottom));
  padding:30px 22px calc(34px + env(safe-area-inset-bottom));
  background:#1a1a1a;text-align:center;font-size:.8rem;line-height:1.6;
  color:rgba(255,255,255,.72);
}
.pie a{color:rgba(255,255,255,.95);font-weight:600;text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:1px}
.pie .cta{margin-top:10px;font-size:.76rem}
.pie .cta a{color:rgba(255,255,255,.72);font-weight:400;border-bottom-color:rgba(255,255,255,.2)}
/* Con ambiente el footer es una franja fina: tiene que entrar en la misma
   pantalla que las dos opciones. */
body.ambiente .pie{margin-top:14px;padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
  font-size:.74rem;line-height:1.45}
/* Dos renglones centrados: en uno solo no entra a 375px y el CTA se partía
   a la mitad ("¿Querés algo así / para tu fiesta?"). */
body.ambiente .pie br{display:none}
body.ambiente .pie .cta{margin-top:4px;font-size:inherit}

/* ⚠️ :not([hidden]) — con display:block a secas, la regla del navegador
   [hidden]{display:none} pierde y la silueta sale en todas las fiestas. */
/* La silueta ocupa SÓLO lo que sobra de la pantalla (flex-basis 0): con
   mucho lugar llega a 170px, con poco se achica, y en una pantalla
   donde no entra nada, desaparece antes de obligar a scrollear. */
.silueta:not([hidden]){display:block;flex:1 1 0;min-height:0;max-height:170px;
  width:100%;object-fit:contain;object-position:center bottom;margin-top:14px;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
@media (max-height:600px){ .silueta:not([hidden]){display:none} }

.volver{
  background:transparent;border:0;color:var(--ink-soft);font-family:inherit;
  font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
  padding:12px 0;min-height:44px;cursor:pointer;margin-top:6px;
}

/* ── Subir fotos ──────────────────────────────────────────────────────
   Elegir y listo: la subida arranca sola, sin un segundo botón. */
.opc{font-size:.62rem;letter-spacing:.08em;text-transform:none;opacity:.85}
.fotos-campo{margin-top:18px}
.barra{margin-top:20px;height:8px;border-radius:8px;background:var(--velo-2);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--secondary);
         transition:width 400ms var(--curva)}
.fotos-estado{margin-top:12px;text-align:center;font-size:.9rem;line-height:1.5;
              color:var(--primary);text-wrap:pretty}
.fotos-estado small{display:block;margin-top:4px;font-size:.78rem;color:var(--ink-soft)}
.miniaturas{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-top:16px}
.mini{aspect-ratio:1;border-radius:10px;background:var(--velo-2) center/cover no-repeat;
      position:relative;overflow:hidden}

const params   = new URLSearchParams(location.search);

const mesa     = (params.get('mesa') || '').trim();

/* El receptor de fotos: un Apps Script que corre con la cuenta de Fer y

const DUPLAS = {
  clasica:     { titulo:"'Cormorant Garamond', Georgia, serif", cuerpo:"'Jost', system-ui, sans-serif",
                 w:['Cormorant+Garamond:wght@300;400;500;600;700','Jost:wght@300;400;500;600'] },

  fashion:     { titulo:"'Bodoni Moda', Georgia, serif", cuerpo:"'Inter', system-ui, sans-serif",
                 w:['Bodoni+Moda:opsz,wght@6..96,400..700','Inter:wght@300;400;500;600'] },
  geometrica:  { titulo:"'Syne', system-ui, sans-serif", cuerpo:"'Inter', system-ui, sans-serif",

  cuento:      { titulo:"'Cinzel Decorative', Georgia, serif", cuerpo:"'Jost', system-ui, sans-serif",

};

const luminancia = hex => {
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if (!m) return null;
  const [r,g,b] = [0,2,4].map(i => parseInt(m[1].substr(i,2),16)/255)
    .map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
  return 0.2126*r + 0.7152*g + 0.0722*b;
};
// Qué color de texto va ARRIBA del acento. Lo mismo que hace invitacion.html:
// el acento de una clienta puede ser verde pastel o bordó, y el texto del
// botón tiene que leerse en los dos.
const contrasteSobre = hex => {
  const L = luminancia(hex);
  if (L === null) return '#1a1a1a';
  const r = (a,b) => (Math.max(a,b)+0.05)/(Math.min(a,b)+0.05);
  return r(L, luminancia('#1a1a1a')) >= r(L, luminancia('#ffffff')) ? '#1a1a1a' : '#ffffff';
};

// Los disparadores. "No sé qué poner" es la razón número uno por la que
// alguien abre esto y lo cierra sin escribir.
const DISPAROS = [
  { chip:'Un recuerdo', ph:'Me acuerdo la vez que…' },
  { chip:'Un consejo',  ph:'Si te puedo decir una sola cosa, es que…' },
  { chip:'Una promesa', ph:'Te prometo que…' },
  // ⚠️ Textos cortos a propósito: con uno más largo los tres no entran en
  // una fila a 390px y el tercero cae solo al medio, que se ve desprolijo.
];

// Cuánto contrastan dos colores. 4,5:1 es el mínimo para que un texto se
// lea; abajo de 3:1 directamente desaparece.
const razon = (a, b) => {
  const L1 = luminancia(a), L2 = luminancia(b);
  if (L1 === null || L2 === null) return 21;
  return (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05);
};
// Mezcla dos colores, igual que color-mix(in srgb).
const mezclar = (a, b, pct) => {
  const h = x => /^#?([0-9a-f]{6})$/i.exec((x||'').trim());
  const A = h(a), B = h(b);
  if (!A || !B) return a;
  const c = i => Math.round(parseInt(A[1].substr(i,2),16) * pct
                          + parseInt(B[1].substr(i,2),16) * (1 - pct));
  return '#' + [0,2,4].map(i => c(i).toString(16).padStart(2,'0')).join('');
};

/* ⚠️ Acepta `true` y el texto "true". Hasta el 28/08/2026 el panel
   guardaba la PALABRA "true" —el value de un <select> es siempre texto—,
   así que activar el libro no lo activaba. Los eventos guardados antes
   del arreglo siguen teniendo el texto adentro. */
const esSi = v => v === true || v === 'true';

let C = {};

function pintarTema() {
  const raiz = document.documentElement.style;
  const papel = C.color_bg || '#ffffff';

  /* ⚠️ NINGUNA paleta de cliente puede dejar esta pantalla ilegible.
     Un amarillo pálido sobre lila —que un cliente puede elegir, y de
     hecho eligió en `demo-enredados`— da 2,7:1: el texto se ve como una
     mancha. Si la tinta que eligió no llega a 4,5:1 sobre su papel, se
     usa negro o blanco, el que gane. */
  const tinta = razon(C.color_1 || '#1a1a1a', papel) >= 4.5
    ? (C.color_1 || '#1a1a1a')
    : contrasteSobre(papel);

  raiz.setProperty('--primary', tinta);
  if (C.color_2) raiz.setProperty('--secondary', C.color_2);
  raiz.setProperty('--bg', papel);
  raiz.setProperty('--on-accent', contrasteSobre(C.color_2 || '#d6ecc0'));

  /* Los textos secundarios son tinta rebajada con papel. El 62% fijo se
     lee bien sobre blanco y desaparece sobre un papel de color, así que
     se busca la mezcla MÁS SUAVE que todavía llegue a 4,5:1.
     ⚠️ Se mide contra `--velo-2`, no contra el papel: los chips y los
     campos van sobre el velo, que es el fondo MÁS parecido a la tinta y
     por lo tanto el peor caso. Midiendo contra el papel quedaban a
     4,38:1 — apenas debajo del mínimo, y a ojo no se nota. */
  const peorFondo = mezclar(tinta, papel, 0.06);
  let suave = mezclar(tinta, papel, 0.62);
  for (let pct = 0.62; pct <= 1.001 && razon(suave, peorFondo) < 4.5; pct += 0.05) {
    suave = mezclar(tinta, papel, Math.min(1, pct));
  }
  raiz.setProperty('--ink-soft', suave);

  const d = DUPLAS[C.fuente] || DUPLAS.clasica;
  raiz.setProperty('--font-titulo', d.titulo);
  raiz.setProperty('--font', d.cuerpo);

  const l = document.createElement('link');
  l.rel = 'stylesheet';
  // Caveat va SIEMPRE, además de la dupla: es la manuscrita de la firma.
  l.href = 'https://fonts.googleapis.com/css2?' +
           d.w.concat(['Caveat:wght@400;600']).map(x => 'family=' + x).join('&') + '&display=swap';
  document.head.appendChild(l);
}

function pintarCabecera() {
  const nombre = C.nombre || '';
  document.getElementById('tipo').textContent  = C.tipo || '';
  document.getElementById('pg-title').textContent = nombre ? `Dejale un deseo a ${nombre}` : 'Dejá tu deseo';

  // La misma foto del splash de la invitación, a lo ancho de la pantalla.
  // ⚠️ Los clientes suben fotos VERTICALES de celular: recortada a una
  // franja apaisada, el centro cae en el torso. El punto de mira va al
  // 25%, igual que el hero de la invitación.
  const foto = C.foto_splash || C.foto_hero || C.foto_hashtag;
  if (foto) document.querySelector('#foto > i').style.backgroundImage = `url("${foto}")`;
  else      document.getElementById('portada').classList.add('sin-foto');

  // El ambiente del libro de deseos, si el evento lo tiene: la acuarela de
  // fondo y la silueta. Sin él, la pantalla queda como siempre.
  if (C.libro_fondo) {
    document.body.classList.add('ambiente');
    document.getElementById('ambiente').style.backgroundImage = `url("${C.libro_fondo}")`;
    if (C.libro_silueta) {
      const s = document.getElementById('silueta');
      s.src = C.libro_silueta;
      s.hidden = false;
    }
  }

  // Una PREGUNTA, no "dejá tu mensaje". A una caja vacía la gente le
  // escribe "felicidades!!"; a una pregunta le contesta de verdad.
  // Concordancia: en un casamiento son DOS. "Elena & Pablo lo va a leer"
  // se lee mal y es lo primero que nota un cliente.
  const plural  = (params.get('t') || '').toLowerCase() === 'p' || /\s(&|y)\s/i.test(nombre);
  const leen    = plural ? 'van' : 'va';
  const le      = plural ? 'les' : 'le';
  const escribi = plural ? 'Escribiles' : 'Escribile';

  document.getElementById('pregunta').textContent =
    nombre ? `¿Qué ${le} deseás a ${nombre}?` : '¿Qué deseás para ellos?';
  // La promesa de privacidad se dice UNA vez, y acá: antes de escribir es
  // cuando saca la duda. Repetida abajo del botón solo ocupaba lugar.
  document.getElementById('ayuda').textContent =
    nombre ? `${escribi} unas líneas. Nadie más las lee: ${leen} directo a ${nombre}.`
           : 'Escribí unas líneas. Nadie más las lee.';

  document.getElementById('ok-texto').textContent =
    nombre ? `${nombre} lo ${leen} a leer después de la fiesta, con todos los demás.`
           : `Lo ${leen} a leer después de la fiesta.`;

  preguntaDeseo = document.getElementById('pregunta').textContent;
  document.getElementById('fotos-ayuda').textContent =
    nombre ? `Elegí las que sacaste esta noche. Van directo al álbum de ${nombre}: nadie más las ve.`
           : 'Elegí las que sacaste esta noche. Nadie más las ve.';
}

/* El recordatorio del alias. Muchos invitados recibieron la invitación
   meses antes y para la noche de la fiesta ya no la tienen a mano.
   ⚠️ Con `modo_regalo: 'sobres'` NO va: en esa fiesta no hay nada que
   transferir y mandaría a la gente a buscar un alias que no existe. */
function pintarRegalo() {
  const alias = (C.alias_pago || '').trim();
  if (!alias || C.modo_regalo === 'sobres') return;

  const nombre = C.nombre || '';
  const plural = (params.get('t') || '').toLowerCase() === 'p' || /\s(&|y)\s/i.test(nombre);
  document.getElementById('regalo-t').textContent = plural
    ? '¿Ya les hiciste tu regalo? Este es el alias, por si no tenés la invitación a mano.'
    : `¿Ya le hiciste tu regalo? Este es el alias de ${nombre || 'la fiesta'}, por si no tenés la invitación a mano.`;
  document.getElementById('alias-n').textContent = alias;
  document.getElementById('regalo').hidden = false;

  const et = document.getElementById('alias-c');
  let volver;
  document.getElementById('btn-alias').onclick = async () => {
    try { await navigator.clipboard.writeText(alias); }
    catch (e) {
      // Sin portapapeles (un navegador viejo, o el WebView de una app):
      // se selecciona el texto para que lo copie a mano en vez de dejarlo
      // tocando un botón que no hace nada.
      const r = document.createRange();
      r.selectNodeContents(document.getElementById('alias-n'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      et.textContent = 'Mantené apretado para copiar';
      clearTimeout(volver);
      volver = setTimeout(() => { et.textContent = 'Tocá para copiarlo'; }, 4000);
      return;
    }
    et.textContent = 'Copiado ✓';
    clearTimeout(volver);
    volver = setTimeout(() => { et.textContent = 'Tocá para copiarlo'; }, 2600);
  };
}

// La última frase que puso un disparador. ⚠️ Sin esto no se puede
// distinguir "lo que escribió la persona" de "la frase que puso el chip
// anterior": tocar un segundo chip no cambiaba nada, y encima quedaba
// marcado un chip que no correspondía al texto.
let frasePuesta = '';

// ¿El campo tiene todavía lo que pusimos nosotros, o ya escribió?
const soloArranque = () => ta.value.trim() === '' || ta.value === frasePuesta;

function pintarChips() {
  const cont = document.getElementById('chips');
  DISPAROS.forEach(d => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = d.chip;
    b.onclick = () => {
      // Solo se reemplaza la frase de arranque. Lo que escribió la
      // persona no se toca nunca — y por eso los chips desaparecen en
      // cuanto empieza a escribir, así este caso no llega a pasar.
      if (!soloArranque()) return;
      cont.querySelectorAll('.chip').forEach(x => x.classList.remove('puesto'));
      b.classList.add('puesto');
      ta.value = d.ph + ' ';
      frasePuesta = ta.value;
      crecer();
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    };
    cont.appendChild(b);
  });
}

// El campo crece con lo que escribís, en vez de dejarte espiando lo que
// escribiste por una ventanita de tres renglones.
const ta = document.getElementById('texto');
function crecer() {
  ta.style.height = 'auto';
  ta.style.height = Math.max(104, ta.scrollHeight) + 'px';
  const q = document.getElementById('cuenta');
  const quedan = 600 - ta.value.length;
  q.textContent = quedan + ' caracteres';
  q.classList.toggle('cerca', quedan <= 100);

  const chips = document.getElementById('chips');
  const arranque = soloArranque();
  chips.classList.toggle('guardados', !arranque);
  // Un chip marcado con un texto que ya no es su frase miente.
  if (!arranque) chips.querySelectorAll('.chip').forEach(x => x.classList.remove('puesto'));
}
ta.addEventListener('input', crecer);

let preguntaDeseo = '';
const esPlural = () => (params.get('t') || '').toLowerCase() === 'p' || /\s(&|y)\s/i.test(C.nombre || '');

function mostrar(id) {
  ['paso-elegir','paso-escribir','paso-listo','paso-fotos'].forEach(p => {
    document.getElementById(p).hidden = (p !== id);
  });
  // Ya contestó: la portada se achica y la pregunta se guarda. Preguntarle
  // de nuevo "¿qué le deseás?" arriba de "quedó guardado" se contradice.
  document.body.classList.toggle('compacta', id === 'paso-listo');
  // La pregunta de la portada cambia con el paso (en `cerrado()` ya no existe).
  const h = document.getElementById('pregunta');
  if (h) h.textContent =
      id === 'paso-elegir' ? `¿Qué querés dejarle${esPlural() ? 's' : ''} a ${C.nombre || 'la fiesta'}?`
    : id === 'paso-fotos'  ? 'Subí tus fotos de la noche'
    : preguntaDeseo;
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// El número sube en vez de aparecer. Es la única recompensa que le queda
// al invitado cuando el muro es privado, así que se le da su segundo.
function contarHasta(n) {
  const el = document.getElementById('ok-n');
  const desde = performance.now(), dur = 900;
  const paso = t => {
    const p = Math.min(1, (t - desde) / dur);
    el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
  // Con 1 el ordinal sobra: "primer deseo" ya lo dice.
  document.getElementById('ok-orden').textContent = n === 1 ? '' : 'º';
  document.getElementById('ok-n-txt').textContent =
    n === 1 ? 'primer deseo de la noche' : 'deseo de la noche';
}

function avisar(txt, foco) {
  const a = document.getElementById('aviso');
  a.textContent = txt;
  a.classList.add('visible');
  if (foco) foco.focus();
}

const btn = document.querySelector('.enviar');

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const texto = ta.value.trim();
  const firma = document.getElementById('firma').value.trim();

  // Sin nombre el deseo no sirve de recuerdo: "alguien te desea lo mejor"
  // no se puede guardar. Los dos campos, y el error donde está el problema.
  if (!texto) return avisar('Escribí tu deseo antes de enviarlo.', ta);
  if (!firma) return avisar('Poné tu nombre así sabe quién se lo escribió.',
                            document.getElementById('firma'));
  document.getElementById('aviso').classList.remove('visible');

  // ⚠️ Se bloquea el botón ANTES de la llamada: en el salón la conexión
  // es mala, la respuesta tarda, y el invitado vuelve a tocar. Sin esto
  // el mismo deseo entra dos y tres veces.
  if (btn.disabled) return;
  btn.disabled = true;
  const antes = btn.textContent;
  btn.textContent = 'Guardando…';

  const { data, error } = await sb.rpc('deseo_enviar', {
    p_evento: eventoId, p_nombre: firma, p_deseo: texto,
    p_mesa: mesa || null
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = antes;
    // El mensaje escrito NO se pierde: sigue en el campo, listo para
    // reintentar. Perder un texto que alguien acaba de pensar es lo peor
    // que puede pasar acá.
    return avisar(/no está activo|pausada|completo|no existe/i.test(error.message)
      ? 'Este libro de deseos no está recibiendo mensajes.'
      : 'No se pudo guardar. Fijate la señal y probá de nuevo — tu mensaje sigue acá.');
  }

  // La carta se va, y recién cuando terminó de irse aparece el sobre.
  document.getElementById('paso-escribir').classList.add('enviando');
  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = antes;
    mostrar('paso-listo');
    contarHasta(Number(data) || 1);
  }, 700);
});

document.getElementById('btn-otro').addEventListener('click', () => {
  ta.value = '';
  frasePuesta = '';
  document.getElementById('firma').value = '';
  crecer();
  document.getElementById('chips').querySelectorAll('.chip').forEach(x => x.classList.remove('puesto'));
  document.getElementById('paso-escribir').classList.remove('enviando');
  mostrar('paso-escribir');
});

// El libro cerrado. ⚠️ Se comprueba ANTES de pintar el formulario: dejar
// que alguien escriba diez renglones para avisarle recién al enviar que no
// está activo es la peor forma de decirlo.
function cerrado(txt) {
  document.getElementById('paso-escribir').hidden = true;
  // ⚠️ La pregunta vive en la portada, FUERA de los dos pasos. Sin esto,
  // el libro cerrado pregunta "¿qué le deseás?" y abajo avisa que no se
  // puede contestar.
  document.getElementById('pregunta').remove();
  document.body.classList.add('compacta');
  const s = document.getElementById('paso-listo');
  s.hidden = false;
  s.querySelector('.sobre').remove();
  s.querySelector('.numero').remove();
  // ⚠️ Y el alias también: una fiesta pausada o inexistente no tiene que
  // mandar a nadie a transferirle plata a nadie.
  s.querySelector('.regalo').remove();
  document.getElementById('btn-otro').remove();
  document.getElementById('ok-titulo').textContent = 'El libro está cerrado';
  document.getElementById('ok-texto').textContent = txt;
}

/* ── Las fotos ─────────────────────────────────────────────────────────
   Elegir y listo: la subida arranca sola. Cada foto se achica EN EL
   CELULAR (1600px, JPEG) antes de salir: de ~4 MB a ~300 KB. Con la señal
   de un salón, eso es la diferencia entre subir y no subir.
   ⚠️ De a una por vez al achicar y de a dos al subir: 30 fotos de 12 MP
   decodificadas juntas cuelgan Safari. Por lo mismo las miniaturas salen
   de la foto ya achicada, nunca del original. */
const FATAL = ['cerrado', 'lleno', 'formato', 'grande'];

async function achicar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const r = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * r);
    c.height = Math.round(img.naturalHeight * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const b64 = c.toDataURL('image/jpeg', 0.82).split(',')[1];
    const t = document.createElement('canvas');
    const tr = 160 / Math.max(c.width, c.height);
    t.width = Math.round(c.width * tr); t.height = Math.round(c.height * tr);
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    const mini = t.toDataURL('image/jpeg', 0.7);
    c.width = c.height = 0;
    return { b64, mini };
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* ⚠️ Con reintento: en el pico de la fiesta (después del vals) Google
   atiende unas 30 a la vez por cuenta y el resto rebota. El invitado no
   se entera: la página espera un poco y vuelve a probar sola. */
async function enviarFoto(b64) {
  let espera = 1200;
  for (let n = 0; n < 5; n++) {
    try {
      const r = await fetch(FOTOS_URL, {
        method: 'POST',
        // text/plain y no JSON: así el navegador no hace el pedido previo
        // de CORS, que Apps Script no contesta.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ evento: eventoId, mesa,
          nombre: document.getElementById('fotos-nombre').value.trim(), datos: b64 })
      });
      const j = await r.json();
      if (j.ok) return j.n;
      if (FATAL.includes(j.error)) throw new Error(j.error);
    } catch (err) {
      if (FATAL.includes(err.message)) throw err;
    }
    await new Promise(ok => setTimeout(ok, espera + Math.random() * 900));
    espera *= 2;
  }
  throw new Error('red');
}

const btnFotos = document.getElementById('btn-fotos');
const inFotos  = document.getElementById('fotos-input');
btnFotos.onclick = () => { if (!btnFotos.disabled) inFotos.click(); };
inFotos.onchange = () => {
  const files = [...inFotos.files].slice(0, 40);
  inFotos.value = '';
  if (files.length) subirTanda(files);
};

async function subirTanda(files) {
  btnFotos.disabled = true;
  btnFotos.textContent = 'Subiendo…';
  document.getElementById('fotos-progreso').hidden = false;
  const cont = document.getElementById('miniaturas');
  cont.textContent = '';
  const minis = files.map(() => {
    const d = document.createElement('div');
    d.className = 'mini espera';
    cont.appendChild(d);
    return d;
  });

  const total = files.length;
  let ok = 0, mal = 0, motivo = '', i = 0;
  const estado = document.getElementById('fotos-estado');
  const pintar = () => {
    document.getElementById('fotos-barra').style.width = ((ok + mal) / total * 100) + '%';
    estado.textContent = '';
    estado.append(`Subiendo ${Math.min(ok + mal + 1, total)} de ${total}…`);
    const s = document.createElement('small');
    s.textContent = 'No cierres esta pantalla hasta que termine.';
    estado.append(s);
  };
  pintar();

  const trabajador = async () => {
    while (i < total) {
      const k = i++;
      try {
        const { b64, mini } = await achicar(files[k]);
        minis[k].style.backgroundImage = `url("${mini}")`;
        await enviarFoto(b64);
        minis[k].className = 'mini ok';
        ok++;
      } catch (err) {
        minis[k].className = 'mini mal';
        mal++;
        if (FATAL.includes(err.message)) motivo = err.message;
      }
      if (ok + mal < total) pintar();
    }
  };
  await Promise.all([trabajador(), trabajador()]);

  document.getElementById('fotos-barra').style.width = '100%';
  estado.textContent = '';
  const nombre = C.nombre || 'la fiesta';
  if (motivo === 'cerrado' || motivo === 'lleno') {
    estado.append('El álbum ya no está recibiendo fotos.');
  } else if (!mal) {
    estado.append(ok === 1 ? '¡Listo! Tu foto ya está en el álbum ♡' : `¡Listo! Subiste ${ok} fotos ♡`);
    const s = document.createElement('small');
    s.textContent = `${nombre} las va a ver después de la fiesta.`;
    estado.append(s);
  } else {
    estado.append(`Subieron ${ok} de ${total}.`);
    const s = document.createElement('small');
    s.textContent = 'Las marcadas con ! no pasaron: probá de nuevo con mejor señal.';
    estado.append(s);
  }
  btnFotos.disabled = false;
  btnFotos.textContent = ok ? 'Subir más fotos' : 'Elegir fotos';
  const aDeseo = document.getElementById('btn-a-deseo');
  if (ok && aDeseo.dataset.ofrecer) aDeseo.hidden = false;
}

(async () => {
  const { data } = await sb.from('eventos').select('id, config').eq('id', eventoId).maybeSingle();
  C = (data && data.config) || {};
  pintarTema();
  pintarCabecera();
  pintarRegalo();
  pintarChips();
  crecer();

  const hayDeseos = esSi(C.deseos_activo);
  const hayFotos  = !!FOTOS_URL && esSi(C.fotos_activo);
  const ambos     = hayDeseos && hayFotos;

  if (!data) {
    cerrado('No encontramos esta fiesta. Fijate que el link esté completo.');
  } else if (esSi(C.pausada)) {
    cerrado('Esta invitación está pausada.');
  } else if (!hayDeseos && !hayFotos) {
    cerrado('Esta fiesta no tiene libro de deseos.');
  } else if (ambos) {
    // Los QR impresos apuntan acá: con fotos activas, primero se elige.
    document.querySelectorAll('[data-volver]').forEach(b => {
      b.hidden = false;
      b.onclick = () => mostrar('paso-elegir');
    });
    document.getElementById('op-deseo').onclick = () => mostrar('paso-escribir');
    document.getElementById('op-fotos').onclick = () => mostrar('paso-fotos');
    const aFotos = document.getElementById('btn-listo-fotos');
    aFotos.hidden = false;
    aFotos.onclick = () => mostrar('paso-fotos');
    // "Dejale un deseo" aparece recién cuando terminó de subir (ver
    // subirTanda): antes le come a la pantalla justo el lugar que falta.
    const aDeseo = document.getElementById('btn-a-deseo');
    aDeseo.dataset.ofrecer = '1';
    aDeseo.onclick = () => mostrar('paso-escribir');
    mostrar('paso-elegir');
  } else if (hayFotos) {
    mostrar('paso-fotos');
  }
  await (document.fonts ? document.fonts.ready : Promise.resolve());
  document.body.classList.add('listo');
})();
</script>
