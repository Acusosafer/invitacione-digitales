<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pg-title">Dejá tu deseo</title>

<!-- ══════════════════════════════════════════════════════════════════════
     LIBRO DE DESEOS — MAQUETA
     Esto es lo que ve el invitado cuando apoya el celular en el tag NFC
     de la mesa. Todavía NO guarda nada: los deseos son de mentira y el
     botón no escribe en la base. Sirve para aprobar el diseño antes de
     construir la tabla.

     La pantalla hereda el tema del evento (?evento=almamia15): los
     colores que eligió la clienta, su dupla tipográfica y su foto. Eso NO
     es decoración — si el invitado toca el tag y aterriza en algo que
     parece otra web, duda y se va. Tiene que ser la misma invitación.

     ⚠️ Ningún color escrito a mano, por la misma razón que en
     invitacion.html: lo que sobre blanco es "gris clarito", sobre #0d0d1a
     es "casi blanco". Ver la sección de colores en CLAUDE.md.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --primary:#1a1a1a; --secondary:#d6ecc0; --bg:#ffffff;
  --on-accent:#1a1a1a;
  --font-titulo:'Cormorant Garamond',Georgia,serif;
  --font:'Jost',system-ui,sans-serif;

  --ink-soft: color-mix(in srgb, var(--primary) 62%, var(--bg));
  --velo-1:   color-mix(in srgb, var(--primary) 3%,  var(--bg));
  --velo-2:   color-mix(in srgb, var(--primary) 6%,  var(--bg));
  --borde:    color-mix(in srgb, var(--primary) 14%, transparent);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--primary);
  font-family:var(--font); font-size:17px; line-height:1.6;
  min-height:100dvh; padding:0 22px calc(40px + env(safe-area-inset-bottom));
  opacity:0; transition:opacity 420ms cubic-bezier(.23,1,.32,1);
}
body.listo{opacity:1}

.hoja{max-width:520px;margin:0 auto}

/* ── Encabezado: la mantiene atada a la invitación ─────────────────── */
.top{display:flex;flex-direction:column;align-items:center;text-align:center;
     padding:38px 0 30px}
.retrato{
  width:78px;height:78px;border-radius:50%;object-fit:cover;
  border:2px solid var(--secondary); background:var(--velo-2);
}
.tipo{
  margin-top:16px;font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink-soft);
}
.quien{font-family:var(--font-titulo);font-size:1.6rem;line-height:1.1;margin-top:4px}

/* ── La pregunta ───────────────────────────────────────────────────── */
h1{
  font-family:var(--font-titulo); font-weight:400;
  font-size:clamp(1.85rem,7.4vw,2.4rem); line-height:1.14;
  letter-spacing:-.015em; text-wrap:balance; text-align:center;
}
.ayuda{
  margin-top:14px;font-size:.93rem;line-height:1.55;color:var(--ink-soft);
  text-align:center;text-wrap:pretty;
}

/* ── El formulario ─────────────────────────────────────────────────── */
form{margin-top:28px}
label{
  display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:8px;
}
textarea,input{
  width:100%;font-family:inherit;font-size:1.05rem;color:var(--primary);
  background:var(--velo-1);border:1px solid var(--borde);border-radius:14px;
  padding:15px 16px;transition:border-color 180ms ease, background 180ms ease;
}
textarea{min-height:150px;resize:vertical;line-height:1.55}
textarea::placeholder,input::placeholder{color:var(--ink-soft);opacity:.75}
textarea:focus,input:focus{
  outline:none;border-color:var(--secondary);background:var(--velo-2);
}
.campo + .campo{margin-top:18px}

.enviar{
  width:100%;margin-top:24px;
  font-family:inherit;font-size:.82rem;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;
  background:var(--secondary);color:var(--on-accent);
  border:0;border-radius:50px;padding:17px 24px;cursor:pointer;
  transition:transform 160ms cubic-bezier(.23,1,.32,1), opacity 160ms ease;
}
.enviar:active{transform:scale(.975)}
.enviar[disabled]{opacity:.5;cursor:default}

.cuantos{
  margin-top:18px;text-align:center;font-size:.8rem;color:var(--ink-soft);
}
.aviso{
  margin-top:10px;text-align:center;font-size:.78rem;color:#c0392b;
  min-height:1.1em;
}

/* ── Confirmación ──────────────────────────────────────────────────── */
.ok{text-align:center;padding:56px 0 20px}
.sello{
  width:74px;height:74px;border-radius:50%;margin:0 auto 24px;
  background:var(--secondary);color:var(--on-accent);
  display:grid;place-items:center;font-size:2rem;
  animation:aparece 520ms cubic-bezier(.23,1,.32,1) both;
}
@keyframes aparece{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.ok h2{font-family:var(--font-titulo);font-weight:400;font-size:1.9rem;line-height:1.15}
.ok p{margin-top:12px;color:var(--ink-soft);font-size:.95rem}
.ver{
  margin-top:30px;background:transparent;color:var(--primary);
  border:1px solid var(--borde);border-radius:50px;padding:15px 30px;
  font-family:inherit;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1);
}
.ver:active{transform:scale(.975)}

/* ── El muro ───────────────────────────────────────────────────────── */
.muro h2{
  font-family:var(--font-titulo);font-weight:400;font-size:1.75rem;
  text-align:center;padding:34px 0 6px;
}
.muro .sub{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-bottom:26px}
.deseo{
  background:var(--velo-1);border:1px solid var(--borde);
  border-left:3px solid var(--secondary);
  border-radius:4px 14px 14px 4px;padding:18px 20px;margin-bottom:12px;
  animation:sube 460ms cubic-bezier(.23,1,.32,1) both;
}
@keyframes sube{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.deseo p{font-size:1rem;line-height:1.6;text-wrap:pretty}
.deseo .firma{
  margin-top:11px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);
}
.deseo.mio{background:var(--velo-2)}
.deseo.mio .firma::after{content:' · tu deseo'}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

/* Marca de maqueta. Va EN EL FLUJO y no fija: fija tapaba una tarjeta del
   muro cada vez que se scrolleaba. */
.maqueta{
  display:block;width:max-content;margin:34px auto 0;
  background:var(--velo-2);border:1px solid var(--borde);
  color:var(--ink-soft);font-size:.66rem;letter-spacing:.1em;
  padding:6px 14px;border-radius:50px;
}
</style>
</head>
<body>

<div class="hoja">

  <div class="top">
    <img id="retrato" class="retrato" alt="">
    <div class="tipo" id="tipo"></div>
    <div class="quien" id="quien"></div>
  </div>

  <!-- PASO 1 — escribir -->
  <section id="paso-escribir">
    <h1 id="pregunta"></h1>
    <p class="ayuda" id="ayuda"></p>

    <form id="form" novalidate>
      <div class="campo">
        <label for="texto">Tu deseo</label>
        <textarea id="texto" maxlength="600"
          placeholder="Que nunca se te apague esa risa…"></textarea>
      </div>
      <div class="campo">
        <label for="firma">De parte de</label>
        <input id="firma" type="text" maxlength="60" autocomplete="name"
          placeholder="Tu nombre">
      </div>
      <button class="enviar" type="submit">Dejar mi deseo</button>
      <p class="aviso" id="aviso"></p>
      <p class="cuantos" id="cuantos"></p>
    </form>
  </section>

  <!-- PASO 2 — listo -->
  <section id="paso-listo" hidden>
    <div class="ok">
      <div class="sello">✓</div>
      <h2>Quedó guardado</h2>
      <p id="ok-texto"></p>
      <button class="ver" id="btn-ver">Ver los de todos</button>
    </div>
  </section>

  <!-- PASO 3 — el muro -->
  <section id="paso-muro" class="muro" hidden>
    <h2>El libro de deseos</h2>
    <p class="sub" id="muro-sub"></p>
    <div id="muro-lista"></div>
  </section>

  <div class="maqueta">Maqueta · todavía no guarda nada</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://ldvosdztnhrvrqxnjuco.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxkdm9zZHp0bmhydnJxeG5qdWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTY1MjAsImV4cCI6MjEwMDg3MjUyMH0.u64wnWOA-Bp0NfOR3tLOAtSkG34P-ApTS00KwTEkGRM';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { db: { schema: 'invitaciones' } });

const params  = new URLSearchParams(location.search);
const eventoId = (params.get('evento') || 'almamia15').trim();

// La misma tabla de duplas que invitacion.html. Los pesos son los que
// publica cada familia: si se le pide a Google uno que no existe, falla el
// pedido entero y no carga ninguna de las dos.
const DUPLAS = {
  clasica:     { titulo:"'Cormorant Garamond', Georgia, serif", cuerpo:"'Jost', system-ui, sans-serif",
                 w:['Cormorant+Garamond:wght@300;400;500;600;700','Jost:wght@300;400;500;600'] },
  editorial:   { titulo:"'Fraunces', Georgia, serif", cuerpo:"'Instrument Sans', system-ui, sans-serif",
                 w:['Fraunces:opsz,wght@9..144,300..700','Instrument+Sans:wght@400;500;600'] },
  altacostura: { titulo:"'Playfair Display', Georgia, serif", cuerpo:"'Montserrat', system-ui, sans-serif",
                 w:['Playfair+Display:wght@400;500;600;700','Montserrat:wght@300;400;500;600'] },
  moderna:     { titulo:"'DM Serif Display', Georgia, serif", cuerpo:"'DM Sans', system-ui, sans-serif",
                 w:['DM+Serif+Display','DM+Sans:wght@300;400;500;700'] },
  romana:      { titulo:"'Marcellus', Georgia, serif", cuerpo:"'Karla', system-ui, sans-serif",
                 w:['Marcellus','Karla:wght@300;400;500;600'] },
  fashion:     { titulo:"'Bodoni Moda', Georgia, serif", cuerpo:"'Inter', system-ui, sans-serif",
                 w:['Bodoni+Moda:opsz,wght@6..96,400..700','Inter:wght@300;400;500;600'] },
  geometrica:  { titulo:"'Syne', system-ui, sans-serif", cuerpo:"'Inter', system-ui, sans-serif",
                 w:['Syne:wght@400;600;700;800','Inter:wght@300;400;500;600'] },
  suave:       { titulo:"'Instrument Serif', Georgia, serif", cuerpo:"'Inter', system-ui, sans-serif",
                 w:['Instrument+Serif','Inter:wght@300;400;500;600'] },
};

const luminancia = hex => {
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if (!m) return null;
  const [r,g,b] = [0,2,4].map(i => parseInt(m[1].substr(i,2),16)/255)
    .map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
  return 0.2126*r + 0.7152*g + 0.0722*b;
};
// Qué color de texto va ARRIBA del acento. Lo mismo que hace invitacion.html:
// el acento de una clienta puede ser verde pastel o bordó, y el texto del
// botón tiene que leerse en los dos.
const contrasteSobre = hex => {
  const L = luminancia(hex);
  if (L === null) return '#1a1a1a';
  const r = (a,b) => (Math.max(a,b)+0.05)/(Math.min(a,b)+0.05);
  return r(L, luminancia('#1a1a1a')) >= r(L, luminancia('#ffffff')) ? '#1a1a1a' : '#ffffff';
};

// Deseos de ejemplo, para que el muro no se vea vacío al aprobar el diseño.
const EJEMPLO = [
  { texto:'Que la vida te trate como vos tratás a los demás. Te quiero muchísimo.', firma:'Tía Susana' },
  { texto:'Nos conocemos desde sala de 3 y no me pierdo un solo cumple tuyo. Que sean mil más.', firma:'Guada' },
  { texto:'Sos la nieta más linda que me pudo tocar. Que Dios te bendiga siempre.', firma:'Abuela Nélida' },
  { texto:'Bailá toda la noche, que mañana descansás.', firma:'Marcos' },
  { texto:'Gracias por hacernos reír siempre. Te merecés todo lo bueno que viene.', firma:'Familia Arce' },
];

let C = {};

function pintarTema() {
  const raiz = document.documentElement.style;
  if (C.color_1)  raiz.setProperty('--primary', C.color_1);
  if (C.color_2)  raiz.setProperty('--secondary', C.color_2);
  if (C.color_bg) raiz.setProperty('--bg', C.color_bg);
  raiz.setProperty('--on-accent', contrasteSobre(C.color_2 || '#d6ecc0'));

  const d = DUPLAS[C.fuente] || DUPLAS.clasica;
  raiz.setProperty('--font-titulo', d.titulo);
  raiz.setProperty('--font', d.cuerpo);

  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?' +
           d.w.map(x => 'family=' + x).join('&') + '&display=swap';
  document.head.appendChild(l);
}

function pintarCabecera() {
  const nombre = C.nombre || '';
  document.getElementById('tipo').textContent  = C.tipo || '';
  document.getElementById('quien').textContent = nombre;
  document.getElementById('pg-title').textContent = nombre ? `Dejale un deseo a ${nombre}` : 'Dejá tu deseo';

  const img = document.getElementById('retrato');
  const foto = C.foto_splash || C.foto_hashtag || C.foto_hero;
  if (foto) { img.src = foto; img.alt = nombre; } else { img.remove(); }

  // Una PREGUNTA, no "dejá tu mensaje". A una caja vacía la gente le
  // escribe "felicidades!!"; a una pregunta le contesta de verdad.
  // Concordancia: en un casamiento son DOS. "Elena & Pablo lo va a leer"
  // se lee mal y es lo primero que nota un cliente. Se deduce del nombre
  // ("Elena & Pablo", "Ana y José") y se puede forzar con &t=p, igual que
  // el saludo de la invitación.
  const plural = (params.get('t') || '').toLowerCase() === 'p' ||
                 /\s(&|y)\s/i.test(nombre);
  const leen     = plural ? 'van' : 'va';
  const escribi  = plural ? 'Escribiles' : 'Escribile';

  document.getElementById('pregunta').textContent =
    nombre ? `¿Qué le deseás a ${nombre}?` : '¿Qué le deseás?';
  document.getElementById('ayuda').textContent =
    nombre ? `${escribi} unas líneas. ${nombre} las ${leen} a leer todas, una por una, cuando pase la fiesta.`
           : `Escribí unas líneas. Las ${leen} a leer todas cuando pase la fiesta.`;

  document.getElementById('cuantos').textContent =
    `Ya le dejaron ${EJEMPLO.length} deseos`;
  document.getElementById('ok-texto').textContent =
    nombre ? `${nombre} lo ${leen} a leer después de la fiesta.`
           : `Lo ${leen} a leer después de la fiesta.`;
  document.getElementById('muro-sub').textContent =
    nombre ? `Lo que le dejaron a ${nombre}` : '';
}

function mostrar(id) {
  ['paso-escribir','paso-listo','paso-muro'].forEach(p => {
    document.getElementById(p).hidden = (p !== id);
  });
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// Se arma con DOM y no con innerHTML: los deseos y las firmas los escribe
// el invitado, y terminan a la vista de toda la fiesta.
function pintarMuro(mio) {
  const cont = document.getElementById('muro-lista');
  cont.textContent = '';
  const todos = mio ? [mio, ...EJEMPLO] : EJEMPLO;
  todos.forEach((d, i) => {
    const caja = document.createElement('div');
    caja.className = 'deseo' + (d === mio ? ' mio' : '');
    caja.style.animationDelay = Math.min(i * 55, 400) + 'ms';
    const p = document.createElement('p');
    p.textContent = d.texto;
    const f = document.createElement('div');
    f.className = 'firma';
    f.textContent = d.firma;
    caja.append(p, f);
    cont.appendChild(caja);
  });
}

let miDeseo = null;

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const texto = document.getElementById('texto').value.trim();
  const firma = document.getElementById('firma').value.trim();
  const aviso = document.getElementById('aviso');

  // Sin nombre el deseo no sirve de recuerdo: "alguien te desea lo mejor"
  // no se puede guardar. Los dos campos, y el error donde está el problema.
  if (!texto) { aviso.textContent = 'Escribí tu deseo antes de enviarlo.';
                document.getElementById('texto').focus(); return; }
  if (!firma) { aviso.textContent = 'Poné tu nombre así sabe quién se lo escribió.';
                document.getElementById('firma').focus(); return; }
  aviso.textContent = '';

  miDeseo = { texto, firma };
  mostrar('paso-listo');
});

document.getElementById('btn-ver').addEventListener('click', () => {
  pintarMuro(miDeseo);
  mostrar('paso-muro');
});

(async () => {
  const { data } = await sb.from('eventos').select('id, config').eq('id', eventoId).maybeSingle();
  C = (data && data.config) || {};
  pintarTema();
  pintarCabecera();
  await (document.fonts ? document.fonts.ready : Promise.resolve());
  document.body.classList.add('listo');
})();
</script>
</body>
</html>
