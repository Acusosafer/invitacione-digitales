<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
    <style>
        /* Dorados de index.html. Antes era rosa #ff3b6f + violeta, que no
           tenía nada que ver con la web: se leían como dos empresas. */
        body {
            margin: 0;
            padding: 40px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 800px;
            height: 400px;
        }
        .logo-container { text-align: center; }

        .shimmer-text {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 700;
            font-size: 58px;
            line-height: 1.02;
            letter-spacing: -0.5px;
            background: linear-gradient(125deg, #A8761F, #F7CE84 45%, #FFF0D0 60%, #E0AE55);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 18px;
        }

        /* Sin neón: el resplandor rosa era lo más "plantilla" del logo.
           Una línea fina a cada lado lee más caro y no depende del color
           de fondo donde se pegue. */
        .oficial {
            font-family: 'Instrument Sans', system-ui, sans-serif;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 11px;
            text-indent: 11px;
            text-transform: uppercase;
            color: #E0AE55;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .oficial::before,
        .oficial::after {
            content: '';
            display: block;
            width: 46px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #A8761F, transparent);
        }
    </style>
</head>
<body>
    <div class="logo-container" id="logo">
        <div class="shimmer-text">Invitaciones<br>Digitales</div>
        <div class="oficial">Oficial</div>
    </div>
</body>
</html>
